name: Apply M5 runtime repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix_m5_runtime_apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse validated patch logic
        run: |
          python3 - <<'PYRUN'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix_m5_runtime.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          code = textwrap.dedent(workflow[start:end])
          try:
              exec(compile(code, 'm5_runtime_patch.py', 'exec'), {})
          except SystemExit as exc:
              # O fonte já foi escrito antes do patch tentar limpar firmware.yml.
              # firmware.yml já foi corrigido diretamente, então este erro é esperado.
              if 'bloco antigo de display no workflow não encontrado' not in str(exc):
                  raise
              print('Workflow de build já está limpo; mantendo patch do firmware.')
          PYRUN

          git checkout -- .github/workflows/firmware.yml

      - name: Validate firmware
        run: |
          grep -q 'M5 PERSONAL v0.9' firmware/m5_personal.ino
          grep -q 'WiFi.setAutoReconnect(false)' firmware/m5_personal.ino
          grep -q 'webServerStopPending' firmware/m5_personal.ino
          grep -q 'prefs.begin("m5-ir", false)' firmware/m5_personal.ino
          grep -q 'prefs.end();' firmware/m5_personal.ino
          test "$(wc -c < firmware/m5_personal.ino)" -gt 50000
          git diff --check -- firmware/m5_personal.ino

      - name: Commit firmware fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/m5_personal.ino
          git commit -m 'fix: stabilize M5 Wi-Fi and Web UI runtime'
          git push origin HEAD:main
