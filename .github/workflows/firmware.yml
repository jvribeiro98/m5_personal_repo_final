name: Build e publicar firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "web/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar ESP32 e bibliotecas
        run: |
          arduino-cli config init
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.8 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "M5Unified"
          arduino-cli lib install "IRremoteESP8266"

      - name: Validar firmware fonte
        run: |
          test -s firmware/m5_personal.ino
          test "$(wc -c < firmware/m5_personal.ino)" -gt 50000
          ! grep -q '^PLACEHOLDER$' firmware/m5_personal.ino
          grep -q '#include <M5Unified.h>' firmware/m5_personal.ino
          grep -q '#include <IRremoteESP8266.h>' firmware/m5_personal.ino
          echo "Firmware fonte: $(wc -c < firmware/m5_personal.ino) bytes"

      - name: Preparar sketch Arduino
        run: |
          rm -rf .build
          mkdir -p .build/m5_personal .build/output
          cp firmware/m5_personal.ino .build/m5_personal/m5_personal.ino

      - name: Aplicar correção de display ao binário publicado
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sketch = Path('.build/m5_personal/m5_personal.ino')
          source = sketch.read_text(encoding='utf-8')

          old_redraw = '''  if (screen == Screen::WIFI_SCANNING ||
              screen == Screen::WIFI_CONNECTING ||
              screen == Screen::MAIN ||
              screen == Screen::WIFI_MENU ||
              screen == Screen::WIFI_NETWORKS ||
              screen == Screen::WIFI_SAVED_LIST ||
              screen == Screen::WIFI_SAVED_DETAIL ||
              screen == Screen::IR_TYPES ||
              screen == Screen::TV_LIST ||
              screen == Screen::AC_LIST) {
            redraw = true;
          }'''

          new_redraw = '''  // Somente telas realmente animadas redesenham continuamente.
          if (screen == Screen::WIFI_SCANNING ||
              screen == Screen::WIFI_CONNECTING) {
            redraw = true;
          }'''

          if old_redraw not in source:
              raise SystemExit('ERRO: bloco de redesenho contínuo não encontrado')
          source = source.replace(old_redraw, new_redraw, 1)

          old_draw = '''  if (redraw) {
            drawScreen();
          }'''
          new_draw = '''  if (redraw) {
            M5.Display.startWrite();
            drawScreen();
            M5.Display.endWrite();
          }'''

          if old_draw not in source:
              raise SystemExit('ERRO: chamada drawScreen não encontrada')
          source = source.replace(old_draw, new_draw, 1)

          # A rolagem horizontal dependia de redesenhar a tela inteira continuamente.
          source = source.replace(
              'if (active && textWidth > labelWidth) {',
              'if (false && active && textWidth > labelWidth) {',
              1,
          )

          source = source.replace(
              'M5 PERSONAL v0.8 - IR + CHECKPOINT 1 iniciado.',
              'M5 PERSONAL v0.8.2 - DISPLAY FIX PUBLICADO.',
              1,
          )

          sketch.write_text(source, encoding='utf-8')
          print('Correção aplicada diretamente ao sketch que será compilado')
          PY

      - name: Validar correção de display aplicada
        run: |
          ! grep -q 'screen == Screen::MAIN ||' .build/m5_personal/m5_personal.ino
          grep -q 'M5.Display.startWrite();' .build/m5_personal/m5_personal.ino
          grep -q 'DISPLAY FIX PUBLICADO' .build/m5_personal/m5_personal.ino

      - name: Compilar firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-path "$GITHUB_WORKSPACE/.build/output" \
            --export-binaries \
            "$GITHUB_WORKSPACE/.build/m5_personal"

      - name: Preparar firmware único
        run: |
          echo "Arquivos gerados pelo compilador:"
          find .build -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

          MERGED_BIN="$(find .build -type f -name '*.merged.bin' -print -quit)"

          if [ -z "$MERGED_BIN" ]; then
            echo "ERRO: o ESP32 Core não gerou o arquivo .merged.bin"
            exit 1
          fi

          test -s "$MERGED_BIN"
          cp "$MERGED_BIN" web/firmware.bin
          echo "Firmware web criado de: $MERGED_BIN"
          ls -lh web/firmware.bin

      - name: Atualizar versão publicada
        env:
          VERSION: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("web/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = os.environ["VERSION"][:7]
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          Path("web/version.json").write_text(
              json.dumps(
                  {
                      "version": os.environ["VERSION"][:7],
                      "commit": os.environ["VERSION"],
                      "built_at": os.environ.get("BUILD_DATE") or "manual",
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validar publicação
        run: |
          test -s web/index.html
          test -s web/manifest.json
          test -s web/version.json
          test -s web/firmware.bin
          test "$(wc -c < web/firmware.bin)" -gt 100000
          ls -lh web/firmware.bin

      - name: Salvar firmware como artefato
        uses: actions/upload-artifact@v4
        with:
          name: m5-personal-${{ github.sha }}
          path: |
            web/firmware.bin
            web/manifest.json
            web/version.json
          if-no-files-found: error
          retention-days: 30

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar conteúdo do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
