name: Add COOLIX support once v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add_coolix_once_v2.yml"

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated Coolix patch
        run: |
          python3 - <<'PYRUN'
          from pathlib import Path
          import textwrap

          wf = Path('.github/workflows/add_coolix_once.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("\n          PY", start)
          code = textwrap.dedent(wf[start:end])

          # O limite de 17C não precisa alterar executeAcAction: applyCoolixState
          # já faz clamp em kCoolixTempMin. Remove só o replace frágil.
          a = code.index("rep('''    case 0:")
          b = code.index("rep('''    \"<option value='0'>Ar Samsung", a)
          code = code[:a] + code[b:]

          exec(compile(code, 'coolix_patch.py', 'exec'), {})
          PYRUN

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 and libraries
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.8 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "M5Unified"
          arduino-cli lib install "IRremoteESP8266"

      - name: Compile patched firmware
        run: |
          mkdir -p .build/m5_personal .build/output
          cp firmware/m5_personal.ino .build/m5_personal/m5_personal.ino
          grep -q '#include <ir_Coolix.h>' firmware/m5_personal.ino
          grep -q 'Midea Antigo' firmware/m5_personal.ino
          grep -q 'IRCoolixAC coolixAc' firmware/m5_personal.ino
          grep -q 'MIDEA_COOLIX' firmware/m5_personal.ino
          arduino-cli compile --fqbn esp32:esp32:esp32 --build-path "$GITHUB_WORKSPACE/.build/output" "$GITHUB_WORKSPACE/.build/m5_personal"

      - name: Commit firmware
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/m5_personal.ino
          git diff --cached --check
          git commit -m 'feat: add COOLIX support for older Midea AC'
          git push origin HEAD:main
