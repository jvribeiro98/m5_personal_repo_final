name: Add COOLIX support once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add_coolix_once.yml"

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch firmware for Midea antigo COOLIX
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('firmware/m5_personal.ino')
          src = path.read_text(encoding='utf-8')

          def rep(old, new, label):
              global src
              if old not in src:
                  raise SystemExit(f'ERRO: não achei {label}')
              src = src.replace(old, new, 1)
              print('OK:', label)

          rep('#include <ir_Midea.h>\n', '#include <ir_Midea.h>\n#include <ir_Coolix.h>\n', 'include Coolix')

          rep('enum class AcBrand : uint8_t {\n  SAMSUNG,\n  MIDEA\n};',
              'enum class AcBrand : uint8_t {\n  SAMSUNG,\n  MIDEA,\n  MIDEA_COOLIX\n};',
              'AcBrand Coolix')

          rep('IRMideaAC mideaAc(IR_PIN);\n',
              'IRMideaAC mideaAc(IR_PIN);\nIRCoolixAC coolixAc(IR_PIN);\n',
              'objeto IRCoolixAC')

          rep('AcDevice airConditioners[] = {\n  {"Ar Samsung", AcBrand::SAMSUNG, {}},\n  {"Ar Midea", AcBrand::MIDEA, {}}\n};',
              'AcDevice airConditioners[] = {\n  {"Ar Samsung", AcBrand::SAMSUNG, {}},\n  {"Ar Midea", AcBrand::MIDEA, {}},\n  {"Midea Antigo", AcBrand::MIDEA_COOLIX, {}}\n};',
              'novo dispositivo Midea Antigo')

          rep('uint8_t mideaFan(AcFan fan);\nvoid applySamsungState(const AcState& state);\nvoid applyMideaState(const AcState& state);',
              'uint8_t mideaFan(AcFan fan);\nuint8_t coolixMode(AcMode mode);\nuint8_t coolixFan(AcFan fan);\nvoid applySamsungState(const AcState& state);\nvoid applyMideaState(const AcState& state);\nvoid applyCoolixState(const AcState& state);',
              'prototipos Coolix')

          rep('  if (device.brand == AcBrand::MIDEA) return "ON";',
              '  if (device.brand == AcBrand::MIDEA || device.brand == AcBrand::MIDEA_COOLIX) return "ON";',
              'sleepName Coolix')

          marker = '''uint8_t mideaFan(AcFan fan) {
            switch (fan) {
              case AcFan::AUTO:         return kMideaACFanAuto;
              case AcFan::LOW_SPEED:    return kMideaACFanLow;
              case AcFan::MEDIUM_SPEED: return kMideaACFanMed;
              case AcFan::HIGH_SPEED:   return kMideaACFanHigh;
            }
            return kMideaACFanAuto;
          }
          '''
          if marker not in src:
              raise SystemExit('ERRO: não achei mideaFan')
          extra = marker + '''
          uint8_t coolixMode(AcMode mode) {
            switch (mode) {
              case AcMode::AUTO: return kCoolixAuto;
              case AcMode::COOL: return kCoolixCool;
              case AcMode::DRY:  return kCoolixDry;
              case AcMode::FAN:  return kCoolixFan;
              case AcMode::HEAT: return kCoolixHeat;
            }
            return kCoolixCool;
          }

          uint8_t coolixFan(AcFan fan) {
            switch (fan) {
              case AcFan::AUTO:         return kCoolixFanAuto;
              case AcFan::LOW_SPEED:    return kCoolixFanMin;
              case AcFan::MEDIUM_SPEED: return kCoolixFanMed;
              case AcFan::HIGH_SPEED:   return kCoolixFanMax;
            }
            return kCoolixFanAuto;
          }
          '''
          src = src.replace(marker, extra, 1)
          print('OK: mapas Coolix')

          rep('''void applyMideaState(const AcState& state) {
            mideaAc.setUseCelsius(true);
            mideaAc.setPower(state.power);
            mideaAc.setMode(mideaMode(state.mode));
            mideaAc.setTemp(state.temp, true);
            mideaAc.setFan(mideaFan(state.fan));
            mideaAc.setSleep(state.sleepMinutes > 0);
            mideaAc.setQuiet(false);
            mideaAc.setSwingVToggle(false);
            mideaAc.setTurboToggle(false);
          }
          ''',
          '''void applyMideaState(const AcState& state) {
            mideaAc.setUseCelsius(true);
            mideaAc.setPower(state.power);
            mideaAc.setMode(mideaMode(state.mode));
            mideaAc.setTemp(state.temp, true);
            mideaAc.setFan(mideaFan(state.fan));
            mideaAc.setSleep(state.sleepMinutes > 0);
            mideaAc.setQuiet(false);
            mideaAc.setSwingVToggle(false);
            mideaAc.setTurboToggle(false);
          }

          void applyCoolixState(const AcState& state) {
            if (!state.power) {
              coolixAc.setPower(false);
              return;
            }

            coolixAc.setPower(true);
            coolixAc.setMode(coolixMode(state.mode));
            coolixAc.setFan(coolixFan(state.fan));
            if (state.mode != AcMode::FAN) {
              uint8_t temp = state.temp < kCoolixTempMin ? kCoolixTempMin : state.temp;
              coolixAc.setTemp(temp);
            }
          }
          ''', 'applyCoolixState')

          rep('''  if (device.brand == AcBrand::SAMSUNG) {
              applySamsungState(state);
              samsungAc.send();
              Serial.println(samsungAc.toString());
            } else {
              applyMideaState(state);
              mideaAc.send();
              Serial.println(mideaAc.toString());
            }
          ''',
          '''  if (device.brand == AcBrand::SAMSUNG) {
              applySamsungState(state);
              samsungAc.send();
              Serial.println(samsungAc.toString());
            } else if (device.brand == AcBrand::MIDEA) {
              applyMideaState(state);
              mideaAc.send();
              Serial.println(mideaAc.toString());
            } else {
              applyCoolixState(state);
              coolixAc.send();
              Serial.println(coolixAc.toString());
            }
          ''', 'sendAcState Coolix')

          rep('''  } else {
              applyMideaState(state);
              mideaAc.send();
            }

            saveAcState(activeAc);
          ''',
          '''  } else if (device.brand == AcBrand::MIDEA) {
              applyMideaState(state);
              mideaAc.send();
            } else {
              applyCoolixState(state);
              coolixAc.send();
              Serial.println(coolixAc.toString());
            }

            saveAcState(activeAc);
          ''', 'toggle power Coolix')

          rep('''  if (device.brand == AcBrand::MIDEA) {
              applyMideaState(state);
              mideaAc.setSwingVToggle(true);
              mideaAc.send();
              mideaAc.setSwingVToggle(false);
              saveAcState(activeAc);
              showToast(state.swing ? "SWING ON" : "SWING OFF");
            } else {
              sendAcState(state.swing ? "SWING ON" : "SWING OFF");
            }
          ''',
          '''  if (device.brand == AcBrand::MIDEA) {
              applyMideaState(state);
              mideaAc.setSwingVToggle(true);
              mideaAc.send();
              mideaAc.setSwingVToggle(false);
              saveAcState(activeAc);
              showToast(state.swing ? "SWING ON" : "SWING OFF");
            } else if (device.brand == AcBrand::MIDEA_COOLIX) {
              applyCoolixState(state);
              coolixAc.setSwing();
              coolixAc.send();
              saveAcState(activeAc);
              showToast(state.swing ? "SWING ON" : "SWING OFF");
            } else {
              sendAcState(state.swing ? "SWING ON" : "SWING OFF");
            }
          ''', 'swing Coolix')

          rep('''  if (device.brand == AcBrand::MIDEA) {
              applyMideaState(state);
              mideaAc.setTurboToggle(true);
              mideaAc.send();
              mideaAc.setTurboToggle(false);
              saveAcState(activeAc);
              showToast(state.turbo ? "TURBO ON" : "TURBO OFF");
            } else {
              sendAcState(state.turbo ? "TURBO ON" : "TURBO OFF");
            }
          ''',
          '''  if (device.brand == AcBrand::MIDEA) {
              applyMideaState(state);
              mideaAc.setTurboToggle(true);
              mideaAc.send();
              mideaAc.setTurboToggle(false);
              saveAcState(activeAc);
              showToast(state.turbo ? "TURBO ON" : "TURBO OFF");
            } else if (device.brand == AcBrand::MIDEA_COOLIX) {
              applyCoolixState(state);
              coolixAc.setTurbo();
              coolixAc.send();
              saveAcState(activeAc);
              showToast(state.turbo ? "TURBO ON" : "TURBO OFF");
            } else {
              sendAcState(state.turbo ? "TURBO ON" : "TURBO OFF");
            }
          ''', 'turbo Coolix')

          rep('''  if (device.brand == AcBrand::MIDEA) {
              state.sleepMinutes = state.sleepMinutes ? 0 : 60;
              sendAcState(String("SLEEP ") + (state.sleepMinutes ? "ON" : "OFF"));
              return;
            }
          ''',
          '''  if (device.brand == AcBrand::MIDEA) {
              state.sleepMinutes = state.sleepMinutes ? 0 : 60;
              sendAcState(String("SLEEP ") + (state.sleepMinutes ? "ON" : "OFF"));
              return;
            }

            if (device.brand == AcBrand::MIDEA_COOLIX) {
              state.sleepMinutes = state.sleepMinutes ? 0 : 60;
              applyCoolixState(state);
              coolixAc.setSleep();
              coolixAc.send();
              saveAcState(activeAc);
              showToast(String("SLEEP ") + (state.sleepMinutes ? "ON" : "OFF"));
              return;
            }
          ''', 'sleep Coolix')

          rep('''    case 0:
              if (state.temp > 16) state.temp--;
              state.power = true;
              sendAcState("TEMP -");
              break;
          ''',
          '''    case 0: {
              const uint8_t minTemp = airConditioners[activeAc].brand == AcBrand::MIDEA_COOLIX ? 17 : 16;
              if (state.temp > minTemp) state.temp--;
              state.power = true;
              sendAcState("TEMP -");
              break;
            }
          ''', 'limite 17C Coolix')

          rep('''    "<option value='0'>Ar Samsung</option><option value='1'>Ar Midea</option>"
          ''',
          '''    "<option value='0'>Ar Samsung</option><option value='1'>Ar Midea</option><option value='2'>Midea Antigo (COOLIX)</option>"
          ''', 'opção Coolix Web UI')

          rep('''    "function changeTemp(v){let n=Number(temp.textContent)+v;temp.textContent=Math.max(16,Math.min(30,n))}</script>";
          ''',
          '''    "function changeTemp(v){let n=Number(temp.textContent)+v;const min=device.value==='2'?17:16;temp.textContent=Math.max(min,Math.min(30,n))}</script>";
          ''', 'limite Web UI Coolix')

          rep('''  mideaAc.stateReset();
            mideaAc.begin();
            applyMideaState(airConditioners[1].state);

            drawScreen();
          ''',
          '''  mideaAc.stateReset();
            mideaAc.begin();
            applyMideaState(airConditioners[1].state);

            coolixAc.stateReset();
            coolixAc.begin();
            applyCoolixState(airConditioners[2].state);

            drawScreen();
          ''', 'inicialização Coolix')

          rep('M5 PERSONAL v0.9 - IR + WIFI RUNTIME FIX', 'M5 PERSONAL v0.9.1 - IR + WIFI + COOLIX', 'versão cabeçalho')
          rep('M5 PERSONAL v0.9 - WIFI RUNTIME FIX iniciado.', 'M5 PERSONAL v0.9.1 - COOLIX iniciado.', 'versão serial')

          path.write_text(src, encoding='utf-8')
          print('Firmware final:', len(src.encode('utf-8')), 'bytes')
          PY

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 and libraries
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.8 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "M5Unified"
          arduino-cli lib install "IRremoteESP8266"

      - name: Compile patched firmware
        run: |
          mkdir -p .build/m5_personal .build/output
          cp firmware/m5_personal.ino .build/m5_personal/m5_personal.ino
          grep -q '#include <ir_Coolix.h>' firmware/m5_personal.ino
          grep -q 'Midea Antigo' firmware/m5_personal.ino
          grep -q 'IRCoolixAC coolixAc' firmware/m5_personal.ino
          arduino-cli compile --fqbn esp32:esp32:esp32 --build-path "$GITHUB_WORKSPACE/.build/output" "$GITHUB_WORKSPACE/.build/m5_personal"

      - name: Commit firmware
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/m5_personal.ino
          git diff --cached --check
          git commit -m 'feat: add COOLIX support for older Midea AC'
          git push origin HEAD:main
